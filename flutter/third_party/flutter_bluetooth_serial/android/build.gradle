group 'io.github.edufolly.flutterbluetoothserial'
version '1.0-SNAPSHOT'

// Versi vendored: plugin asli memakai jcenter() dan classpath AGP 4.1.0 yang
// sudah dihapus/tidak kompatibel dengan Gradle 9 + AGP 9 di Flutter 3.50.
// Repositori dan plugin Android kini diwariskan dari root project.
apply plugin: 'com.android.library'

android {
    namespace 'io.github.edufolly.flutterbluetoothserial'
    compileSdkVersion 35

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    defaultConfig {
        minSdkVersion 24
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    lintOptions {
        disable 'InvalidPackage'
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
}
